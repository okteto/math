apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 0
      containers:
      - name: worker
        image: ${OKTETO_BUILD_APP_IMAGE}
        command: ["./run_celery.sh"]
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
        