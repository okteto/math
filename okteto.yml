icon: https://github.com/okteto/math/raw/master/icon.png

build:
  web:
    context: .
    dockerfile: Dockerfile
  worker:
    context: .
    dockerfile: Dockerfile

deploy:
  compose:
    file: docker-compose.yml

dev:
  web:
    command: ["sh", "-c", "./run_web.sh"]
    sync:
      - .:/app
    environment:
        - WAIT_FOR_FILE_SYNC=true
    services:
      - name: worker
        command: ["sh", "-c", "./run_celery.sh"]
        sync:
          - .:/app
        environment:
        - WAIT_FOR_FILE_SYNC=true
    forward:
      - 8080:8080
